# Serves the static landing site inside its own container. TLS is
# terminated by the backend's Nginx container, which proxies
# laindainwallet.com here over the shared lain-dain-proxy network.
# Mirrors the behaviour of vercel.json (clean URLs + headers).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Never expose dotfiles (.git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # cleanUrls: /privacy.html -> /privacy
    location ~ ^/(?<page>.+)\.html$ {
        if ($request_uri ~ ^[^?]*\.html(\?|$)) {
            return 301 /$page$is_args$args;
        }
        try_files $uri =404;
    }

    location = /index {
        return 301 /$is_args$args;
    }

    # trailingSlash: false
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /index.html;
}
